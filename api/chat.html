<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Chatbot</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <style>
    :root {
      --bg: #fafafa;
      --panel: #ffffff;
      --sidebar: #f4f4f5;
      --text: #1a1a1a;
      --muted: #777777;
      --border: #e5e5e5;
      --hover: #e9e9eb;
      --accent: #2563eb;

      --user-bubble: #2563eb;
      --user-text: #ffffff;

      --bot-bubble: #f1f1f1;

      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg: #171717;
      --panel: #202020;
      --sidebar: #181818;
      --text: #f5f5f5;
      --muted: #a0a0a0;
      --border: #303030;
      --hover: #303030;
      --accent: #3b82f6;

      --user-bubble: #2563eb;
      --user-text: #ffffff;

      --bot-bubble: #2b2b2b;

      --input-bg: #252525;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    /* =========================
       MAIN SHELL
    ========================= */

    .shell {
      width: 100%;
      height: 100dvh;

      display: flex;

      background: var(--panel);

      overflow: hidden;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      width: 260px;
      min-width: 260px;
      height: 100%;

      display: flex;
      flex-direction: column;

      background: var(--sidebar);

      border-right:
        1px solid var(--border);

      transition:
        width 0.25s ease,
        min-width 0.25s ease;

      z-index: 20;
    }

    .sidebar.collapsed {
      width: 0;
      min-width: 0;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 14px;

      border-bottom:
        1px solid var(--border);
    }

    .new-chat-btn {
      width: 100%;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 13px 14px;

      border:
        1px solid var(--border);

      border-radius: 12px;

      background: var(--panel);

      color: var(--text);

      font-size: 15px;

      cursor: pointer;
    }

    .new-chat-btn:hover {
      background: var(--hover);
    }

    .new-chat-btn svg {
      width: 20px;
      height: 20px;
    }

    .conv-list {
      flex: 1;

      overflow-y: auto;

      padding: 10px;
    }

    .conv-item {
      width: 100%;

      display: flex;
      align-items: center;

      gap: 8px;

      padding: 12px;

      border-radius: 10px;

      cursor: pointer;

      margin-bottom: 4px;

      color: var(--text);
    }

    .conv-item:hover,
    .conv-item.active {
      background: var(--hover);
    }

    .conv-title {
      flex: 1;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;
    }

    .conv-delete {
      width: 30px;
      height: 30px;

      border: none;

      background: transparent;

      color: var(--muted);

      border-radius: 7px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .conv-delete:hover {
      background: rgba(255, 0, 0, 0.1);
      color: red;
    }

    .conv-delete svg {
      width: 16px;
      height: 16px;
    }

    .sidebar-section-label {
      padding: 10px 16px 6px;

      font-size: 12px;

      letter-spacing: 1px;

      text-transform: uppercase;

      color: var(--muted);
    }

    .project-area {
      padding: 0 10px 10px;
    }

    .sidebar-footer {
      border-top:
        1px solid var(--border);

      padding: 14px;

      text-align: center;

      color: var(--muted);

      font-size: 13px;
    }

    /* =========================
       OVERLAY
    ========================= */

    .sidebar-overlay {
      display: none;
    }

    /* =========================
       APP
    ========================= */

    .app {
      flex: 1;

      min-width: 0;

      height: 100%;

      display: flex;
      flex-direction: column;

      background: var(--panel);
    }

    /* =========================
       HEADER
    ========================= */

    header {
      height: 70px;

      min-height: 70px;

      display: flex;
      align-items: center;

      gap: 12px;

      padding: 0 20px;

      border-bottom:
        1px solid var(--border);
    }

    #sidebarToggle {
      width: 42px;
      height: 42px;

      border-radius: 10px;

      border:
        1px solid var(--border);

      background: var(--bg);

      color: var(--text);

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    #sidebarToggle svg {
      width: 20px;
      height: 20px;
    }

    #chatTitle {
      flex: 1;

      margin: 0;

      font-size: 18px;

      overflow: hidden;

      white-space: nowrap;

      text-overflow: ellipsis;
    }

    #themeToggle {
      width: 42px;
      height: 42px;

      border-radius: 10px;

      border:
        1px solid var(--border);

      background: var(--bg);

      color: var(--text);

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      flex-shrink: 0;
    }

    #themeToggle svg {
      width: 21px;
      height: 21px;
    }

    .moon {
      display: none;
    }

    [data-theme="dark"] .sun {
      display: none;
    }

    [data-theme="dark"] .moon {
      display: block;
    }

    /* =========================
       CHAT
    ========================= */

    #log {
      flex: 1;

      overflow-y: auto;

      padding: 25px;

      display: flex;

      flex-direction: column;

      gap: 16px;
    }

    .row {
      display: flex;

      flex-direction: column;

      max-width: 80%;
    }

    .row.user {
      align-self: flex-end;
    }

    .row.bot {
      align-self: flex-start;
    }

    .bubble {
      padding: 12px 15px;

      border-radius: 15px;

      font-size: 15px;

      line-height: 1.55;

      word-break: break-word;
    }

    .row.user .bubble {
      background: var(--user-bubble);

      color: var(--user-text);

      border-bottom-right-radius: 4px;

      white-space: pre-wrap;
    }

    .row.bot .bubble {
      background: var(--bot-bubble);

      color: var(--text);

      border-bottom-left-radius: 4px;
    }

    .bubble p {
      margin: 0 0 8px;
    }

    .bubble p:last-child {
      margin-bottom: 0;
    }

    .bubble pre {
      overflow-x: auto;

      padding: 12px;

      border-radius: 8px;

      background: rgba(0,0,0,0.1);
    }

    .bubble code {
      background: rgba(0,0,0,0.1);

      padding: 2px 5px;

      border-radius: 4px;
    }

    /* =========================
       EMPTY STATE
    ========================= */

    .empty-state {
      flex: 1;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      text-align: center;

      padding: 20px;
    }

    .emoji {
      font-size: 48px;

      margin-bottom: 15px;
    }

    .greeting {
      font-size: 30px;

      font-weight: 600;
    }

    .sub {
      margin-top: 8px;

      color: var(--muted);
    }

    /* =========================
       ERROR
    ========================= */

    .error {
      color: #dc2626;

      padding: 0 20px 10px;

      font-size: 14px;
    }

    /* =========================
       INPUT
    ========================= */

    form {
      display: flex;

      gap: 10px;

      padding: 16px 20px;

      border-top:
        1px solid var(--border);
    }

    input {
      flex: 1;

      min-width: 0;

      height: 50px;

      padding: 0 16px;

      border-radius: 12px;

      border:
        1px solid var(--border);

      background: var(--input-bg);

      color: var(--text);

      font-size: 16px;

      outline: none;
    }

    input:focus {
      border-color: var(--accent);
    }

    button[type="submit"] {
      height: 50px;

      padding: 0 24px;

      border: none;

      border-radius: 12px;

      background: var(--accent);

      color: white;

      font-size: 16px;

      cursor: pointer;

      flex-shrink: 0;
    }

    button[type="submit"]:disabled {
      opacity: 0.6;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 640px) {

      .shell {
        position: relative;

        width: 100%;
        height: 100dvh;
      }

      .app {
        width: 100%;
      }

      /* Sidebar Drawer */

      .sidebar {
        position: fixed;

        top: 0;
        left: 0;

        width: 280px;
        min-width: 280px;

        height: 100dvh;

        z-index: 1001;

        transform: translateX(-100%);

        transition: transform 0.28s ease;

        box-shadow:
          8px 0 25px rgba(0,0,0,0.2);
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .sidebar.collapsed {
        width: 280px;
        min-width: 280px;

        transform: translateX(-100%);
      }

      /* Overlay */

      .sidebar-overlay {
        display: block;

        position: fixed;

        top: 0;
        left: 0;

        width: 100%;
        height: 100dvh;

        background: rgba(0,0,0,0.35);

        z-index: 1000;

        opacity: 0;

        visibility: hidden;

        transition:
          opacity 0.28s ease,
          visibility 0.28s ease;
      }

      .sidebar-overlay.show {
        opacity: 1;

        visibility: visible;
      }

      /* Header */

      header {
        width: 100%;

        height: 62px;

        min-height: 62px;

        padding: 0 12px;
      }

      #sidebarToggle {
        width: 40px;
        height: 40px;
      }

      #themeToggle {
        width: 40px;
        height: 40px;
      }

      #chatTitle {
        font-size: 16px;
      }

      /* Messages */

      #log {
        width: 100%;

        padding: 14px 12px;

        gap: 12px;
      }

      .row {
        max-width: 88%;
      }

      .row.bot {
        max-width: 94%;
      }

      .bubble {
        font-size: 14px;

        padding: 11px 13px;
      }

      /* Empty */

      .greeting {
        font-size: 25px;
      }

      /* Input */

      form {
        width: 100%;

        padding: 10px 12px;

        gap: 8px;
      }

      input {
        height: 48px;

        font-size: 16px;
      }

      button[type="submit"] {
        height: 48px;

        padding: 0 17px;

        font-size: 15px;
      }

    }

    /* Scrollbar */

    #log::-webkit-scrollbar,
    .conv-list::-webkit-scrollbar {
      width: 6px;
    }

    #log::-webkit-scrollbar-thumb,
    .conv-list::-webkit-scrollbar-thumb {
      background: var(--border);

      border-radius: 10px;
    }

  </style>
</head>

<body>

  <div class="shell">

    <!-- SIDEBAR -->

    <aside
      class="sidebar"
      id="sidebar"
    >

      <div class="sidebar-top">

        <button
          class="new-chat-btn"
          id="newChatBtn"
          type="button"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M12 5v14M5 12h14"></path>
          </svg>

          New chat

        </button>

      </div>


      <div
        class="conv-list"
        id="convList"
      ></div>


      <div class="sidebar-section-label">
        Projects
      </div>


      <div class="project-area">

        <button
          class="new-chat-btn"
          id="newProjectBtn"
          type="button"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-6l-2-2H5a2 2 0 0 0-2 2z"></path>
          </svg>

          New project

        </button>

      </div>


      <div class="sidebar-footer">
        Made by Jahanzaib
      </div>

    </aside>


    <!-- MOBILE OVERLAY -->

    <div
      class="sidebar-overlay"
      id="sidebarOverlay"
    ></div>


    <!-- APP -->

    <main class="app">

      <header>

        <button
          id="sidebarToggle"
          type="button"
          aria-label="Open menu"
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M3 12h18"></path>
            <path d="M3 6h18"></path>
            <path d="M3 18h18"></path>
          </svg>

        </button>


        <h1 id="chatTitle">
          Chatbot
        </h1>


        <button
          id="themeToggle"
          type="button"
        >

          <svg
            class="sun"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle
              cx="12"
              cy="12"
              r="4"
            ></circle>

            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>


          <svg
            class="moon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>

        </button>

      </header>


      <div
        id="log"
      ></div>


      <div
        class="empty-state"
        id="emptyState"
      >

        <div
          class="emoji"
          id="emptyEmoji"
        >
          👋
        </div>

        <div
          class="greeting"
          id="emptyGreeting"
        >
          Welcome!
        </div>

        <div class="sub">
          What can I help you with today?
        </div>

      </div>


      <div
        class="error"
        id="errorMsg"
        style="display:none"
      ></div>


      <form id="chatForm">

        <input
          id="input"
          type="text"
          placeholder="Message..."
          autocomplete="off"
        />

        <button
          id="sendBtn"
          type="submit"
        >
          Send
        </button>

      </form>

    </main>

  </div>


  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const sidebar =
      document.getElementById("sidebar");

    const sidebarOverlay =
      document.getElementById("sidebarOverlay");

    const sidebarToggle =
      document.getElementById("sidebarToggle");

    const convList =
      document.getElementById("convList");

    const chatTitle =
      document.getElementById("chatTitle");

    const log =
      document.getElementById("log");

    const emptyState =
      document.getElementById("emptyState");

    const form =
      document.getElementById("chatForm");

    const input =
      document.getElementById("input");

    const sendBtn =
      document.getElementById("sendBtn");

    const errorMsg =
      document.getElementById("errorMsg");


    /* =========================
       API
       Apna existing API yahan rakho
    ========================= */

    const API_URL = "/chat";


    /* =========================
       STORAGE
    ========================= */

    const STORAGE_KEY =
      "chatbot_conversations_v1";

    let conversations = [];

    let activeId = null;


    /* =========================
       MOBILE CHECK
    ========================= */

    function isMobile() {
      return window.innerWidth <= 640;
    }


    /* =========================
       SIDEBAR OPEN
    ========================= */

    function openSidebar() {

      if (!isMobile()) {
        return;
      }

      sidebar.classList.add("open");

      sidebarOverlay.classList.add("show");

    }


    /* =========================
       SIDEBAR CLOSE
    ========================= */

    function closeSidebar() {

      if (!isMobile()) {
        return;
      }

      sidebar.classList.remove("open");

      sidebarOverlay.classList.remove("show");

    }


    /* =========================
       SIDEBAR TOGGLE
    ========================= */

    function toggleSidebar() {

      if (isMobile()) {

        if (
          sidebar.classList.contains("open")
        ) {

          closeSidebar();

        } else {

          openSidebar();

        }

      } else {

        sidebar.classList.toggle("collapsed");

      }

    }


    sidebarToggle.addEventListener(
      "click",
      toggleSidebar
    );


    /* CLICK OUTSIDE */

    sidebarOverlay.addEventListener(
      "click",
      closeSidebar
    );


    /* =========================
       SWIPE SUPPORT
    ========================= */

    let touchStartX = 0;

    let touchStartY = 0;


    document.addEventListener(
      "touchstart",

      function(e) {

        touchStartX =
          e.changedTouches[0].screenX;

        touchStartY =
          e.changedTouches[0].screenY;

      },

      {
        passive: true
      }

    );


    document.addEventListener(
      "touchend",

      function(e) {

        if (!isMobile()) {
          return;
        }

        const touchEndX =
          e.changedTouches[0].screenX;

        const touchEndY =
          e.changedTouches[0].screenY;


        const diffX =
          touchEndX -
          touchStartX;

        const diffY =
          touchEndY -
          touchStartY;


        /* Vertical swipe ignore */

        if (
          Math.abs(diffY) >
          Math.abs(diffX)
        ) {
          return;
        }


        /* RIGHT SWIPE FROM LEFT EDGE */

        if (
          touchStartX < 50 &&
          diffX > 60
        ) {

          openSidebar();

        }


        /* LEFT SWIPE */

        if (
          diffX < -60
        ) {

          closeSidebar();

        }

      },

      {
        passive: true
      }

    );


    /* =========================
       RESPONSIVE
    ========================= */

    function setupResponsiveSidebar() {

      if (isMobile()) {

        sidebar.classList.remove("open");

        sidebarOverlay.classList.remove("show");

        sidebar.classList.remove("collapsed");

      } else {

        sidebar.classList.remove("open");

        sidebarOverlay.classList.remove("show");

        sidebar.classList.remove("collapsed");

      }

    }


    window.addEventListener(
      "resize",
      setupResponsiveSidebar
    );


    /* =========================
       THEME
    ========================= */

    const root =
      document.documentElement;


    document
      .getElementById("themeToggle")
      .addEventListener(
        "click",
        function() {

          const isDark =
            root.getAttribute("data-theme") === "dark";


          root.setAttribute(
            "data-theme",

            isDark
              ? "light"
              : "dark"
          );

        }
      );


    /* =========================
       LOAD CONVERSATIONS
    ========================= */

    function loadConversations() {

      try {

        const data =
          localStorage.getItem(
            STORAGE_KEY
          );


        if (data) {

          conversations =
            JSON.parse(data);

        }

      } catch (error) {

        conversations = [];

      }

    }


    /* =========================
       SAVE CONVERSATIONS
    ========================= */

    function saveConversations() {

      localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(
          conversations
        )

      );

    }


    /* =========================
       CREATE CHAT
    ========================= */

    function createConversation(
      isProject = false
    ) {

      const conversation = {

        id:
          "chat_" +
          Date.now() +
          "_" +
          Math.random()
            .toString(36)
            .slice(2, 8),

        title:
          isProject
            ? "Project"
            : "New chat",

        isProject:
          isProject,

        messages: []

      };


      conversations.unshift(
        conversation
      );


      activeId =
        conversation.id;


      saveConversations();

      renderSidebar();

      renderActiveConversation();


      /* MOBILE CLOSE */

      closeSidebar();

    }


    /* =========================
       GET ACTIVE CHAT
    ========================= */

    function getActiveConversation() {

      return conversations.find(

        conversation =>
          conversation.id === activeId

      );

    }


    /* =========================
       SWITCH CHAT
    ========================= */

    function switchConversation(
      id
    ) {

      activeId =
        id;


      renderSidebar();

      renderActiveConversation();


      /* Mobile par chat open hote hi sidebar close */

      closeSidebar();

    }


    /* =========================
       DELETE CHAT
    ========================= */

    function deleteConversation(
      id,
      event
    ) {

      event.stopPropagation();


      conversations =
        conversations.filter(

          conversation =>
            conversation.id !== id

        );


      if (
        activeId === id
      ) {

        activeId =
          conversations.length > 0
            ? conversations[0].id
            : null;

      }


      if (
        conversations.length === 0
      ) {

        createConversation();

        return;

      }


      saveConversations();

      renderSidebar();

      renderActiveConversation();

    }


    /* =========================
       RENDER SIDEBAR
    ========================= */

    function renderSidebar() {

      convList.innerHTML =
        "";


      conversations.forEach(

        conversation => {

          const item =
            document.createElement("div");


          item.className =
            "conv-item";


          if (
            conversation.id === activeId
          ) {

            item.classList.add("active");

          }


          item.addEventListener(

            "click",

            function() {

              switchConversation(
                conversation.id
              );

            }

          );


          const title =
            document.createElement("div");


          title.className =
            "conv-title";


          title.textContent =
            conversation.title;


          const deleteButton =
            document.createElement("button");


          deleteButton.type =
            "button";


          deleteButton.className =
            "conv-delete";


          deleteButton.innerHTML =
            `
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M3 6h18"></path>
              <path d="M8 6V4h8v2"></path>
              <path d="M19 6l-1 14H6L5 6"></path>
            </svg>
            `;


          deleteButton.addEventListener(

            "click",

            function(event) {

              deleteConversation(

                conversation.id,

                event

              );

            }

          );


          item.appendChild(
            title
          );


          item.appendChild(
            deleteButton
          );


          convList.appendChild(
            item
          );

        }

      );

    }


    /* =========================
       RENDER ACTIVE CHAT
    ========================= */

    function renderActiveConversation() {

      const conversation =
        getActiveConversation();


      log.innerHTML =
        "";


      if (!conversation) {

        chatTitle.textContent =
          "Chatbot";

        emptyState.style.display =
          "flex";

        return;

      }


      chatTitle.textContent =
        conversation.title === "New chat"
          ? "Chatbot"
          : conversation.title;


      if (
        conversation.messages.length === 0
      ) {

        emptyState.style.display =
          "flex";

        log.style.display =
          "none";

        return;

      }


      emptyState.style.display =
        "none";


      log.style.display =
        "flex";


      conversation.messages.forEach(

        message => {

          addMessageToScreen(

            message.role,

            message.content

          );

        }

      );


      scrollToBottom();

    }


    /* =========================
       ADD MESSAGE
    ========================= */

    function addMessageToScreen(
      role,
      content
    ) {

      const row =
        document.createElement("div");


      row.className =
        "row " + role;


      const bubble =
        document.createElement("div");


      bubble.className =
        "bubble";


      if (
        role === "user"
      ) {

        bubble.textContent =
          content;

      } else {

        bubble.innerHTML =
          marked.parse(
            content
          );

      }


      row.appendChild(
        bubble
      );


      log.appendChild(
        row
      );


      scrollToBottom();


      return row;

    }


    /* =========================
       THINKING
    ========================= */

    function addThinking() {

      const row =
        document.createElement("div");


      row.className =
        "row bot";


      const bubble =
        document.createElement("div");


      bubble.className =
        "bubble";


      bubble.textContent =
        "Thinking...";


      row.appendChild(
        bubble
      );


      log.appendChild(
        row
      );


      scrollToBottom();


      return row;

    }


    /* =========================
       SCROLL
    ========================= */

    function scrollToBottom() {

      setTimeout(

        function() {

          log.scrollTop =
            log.scrollHeight;

        },

        50

      );

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage(
      text
    ) {

      const conversation =
        getActiveConversation();


      if (!conversation) {
        return;
      }


      errorMsg.style.display =
        "none";


      emptyState.style.display =
        "none";


      log.style.display =
        "flex";


      /* ADD USER MESSAGE */

      conversation.messages.push({

        role: "user",

        content: text

      });


      /* Normal chat title */

      if (
        conversation.title === "New chat"
      ) {

        conversation.title =
          text.length > 35
            ? text.substring(0, 35) + "..."
            : text;

      }


      saveConversations();

      renderSidebar();


      addMessageToScreen(
        "user",
        text
      );


      input.value =
        "";


      sendBtn.disabled =
        true;


      const thinking =
        addThinking();


      try {

        /*
          Conversation history
        */

        const history =
          conversation.messages.map(

            message => ({

              role: message.role,

              content: message.content

            })

          );


        const response =
          await fetch(

            API_URL,

            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json"

              },

              body:
                JSON.stringify({

                  message: text,

                  history: history

                })

            }

          );


        if (!response.ok) {

          throw new Error(
            "Server error"
          );

        }


        const data =
          await response.json();


        thinking.remove();


        const reply =
          data.reply ||
          data.message ||
          "No response received.";


        conversation.messages.push({

          role: "bot",

          content: reply

        });


        saveConversations();


        addMessageToScreen(
          "bot",
          reply
        );


      } catch (error) {

        thinking.remove();


        errorMsg.textContent =
          "Error: " +
          error.message;


        errorMsg.style.display =
          "block";

      }


      sendBtn.disabled =
        false;


      input.focus();

    }


    /* =========================
       FORM SUBMIT
    ========================= */

    form.addEventListener(

      "submit",

      async function(event) {

        event.preventDefault();


        const text =
          input.value.trim();


        if (!text) {
          return;
        }


        await sendMessage(
          text
        );

      }

    );


    /* =========================
       NEW CHAT
    ========================= */

    document
      .getElementById("newChatBtn")
      .addEventListener(

        "click",

        function() {

          createConversation(
            false
          );

        }

      );


    /* =========================
       NEW PROJECT
    ========================= */

    document
      .getElementById("newProjectBtn")
      .addEventListener(

        "click",

        function() {

          createConversation(
            true
          );

        }

      );


    /* =========================
       INIT
    ========================= */

    loadConversations();


    if (
      conversations.length === 0
    ) {

      createConversation();

    } else {

      activeId =
        conversations[0].id;


      renderSidebar();

      renderActiveConversation();

    }


    setupResponsiveSidebar();

  </script>

</body>
</html>
