<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<style>
  :root {
    --bg: #fafafa;
    --panel: #ffffff;
    --text: #1a1a1a;
    --muted: #767676;
    --border: #e5e5e5;
    --user-bubble: #1a1a1a;
    --user-text: #ffffff;
    --bot-bubble: #f0f0f0;
    --accent: #2563eb;
    --input-bg: #ffffff;
  }

  [data-theme="dark"] {
    --bg: #16171a;
    --panel: #1e1f23;
    --text: #f2f2f2;
    --muted: #9a9ba3;
    --border: #2e2f34;
    --user-bubble: #2563eb;
    --user-text: #ffffff;
    --bot-bubble: #26272c;
    --accent: #3b82f6;
    --input-bg: #1e1f23;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .app {
    width: 100%;
    max-width: 680px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  header {
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }

  header .sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 2px;
  }

  #themeToggle {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s, border-color 0.2s;
  }

  #themeToggle:hover {
    border-color: var(--accent);
  }

  #themeToggle svg {
    width: 18px;
    height: 18px;
  }

  #themeToggle .moon { display: none; }
  [data-theme="dark"] #themeToggle .sun { display: none; }
  [data-theme="dark"] #themeToggle .moon { display: block; }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .row {
    display: flex;
    max-width: 78%;
  }

  .row.user {
    align-self: flex-end;
  }

  .row.bot {
    align-self: flex-start;
  }

  .bubble {
    padding: 11px 15px;
    border-radius: 14px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-text);
    border-bottom-right-radius: 4px;
  }

  .row.bot .bubble {
    background: var(--bot-bubble);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }

  .bubble.typing::after {
    content: "...";
    opacity: 0.5;
  }

  form {
    display: flex;
    gap: 10px;
    padding: 16px 22px 20px;
    border-top: 1px solid var(--border);
  }

  input {
    flex: 1;
    background: var(--input-bg);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.2s;
  }

  input::placeholder {
    color: var(--muted);
  }

  input:focus {
    border-color: var(--accent);
  }

  button[type="submit"] {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 0 20px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  button[type="submit"]:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .error {
    color: #dc2626;
    font-size: 13px;
    padding: 0 22px 8px;
  }

  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <h1>Chatbot</h1>
      <div class="sub">Groq · GPT-OSS-120B</div>
    </div>
    <button id="themeToggle" type="button" aria-label="Toggle dark mode">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"></circle>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
      </svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <div id="log"></div>
  <div class="error" id="errorMsg" style="display:none;"></div>

  <form id="chatForm">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
  const root = document.documentElement;
  const themeToggle = document.getElementById("themeToggle");

  themeToggle.addEventListener("click", () => {
    const isDark = root.getAttribute("data-theme") === "dark";
    root.setAttribute("data-theme", isDark ? "light" : "dark");
  });

  const API_URL = "/chat";

  const log = document.getElementById("log");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const errorMsg = document.getElementById("errorMsg");

  let history = [];

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot");

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    errorMsg.style.display = "none";
    addBubble("user", message);
    input.value = "";
    sendBtn.disabled = true;

    const typingBubble = addBubble("bot", "");
    typingBubble.classList.add("typing");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });

      const data = await res.json();

      if (data.error) {
        throw new Error(data.error);
      }

      typingBubble.classList.remove("typing");
      typingBubble.textContent = data.reply;

      history.push({ role: "user", content: message });
      history.push({ role: "assistant", content: data.reply });

    } catch (err) {
      typingBubble.parentElement.remove();
      errorMsg.textContent = "Error: " + err.message;
      errorMsg.style.display = "block";
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
