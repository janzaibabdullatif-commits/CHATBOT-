<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #12181f;
    --text: #e6edf3;
    --muted: #7d8b99;
    --accent: #e0a458;
    --accent-dim: #4a3b26;
    --user-bubble: #1c2530;
    --border: #202932;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .app {
    width: 100%;
    max-width: 720px;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
  }

  header .label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
  }

  header h1 {
    font-size: 20px;
    margin: 4px 0 0;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .row {
    display: flex;
    flex-direction: column;
    max-width: 82%;
  }

  .row.user {
    align-self: flex-end;
    align-items: flex-end;
  }

  .row.bot {
    align-self: flex-start;
    align-items: flex-start;
  }

  .who {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .row.user .bubble {
    background: var(--user-bubble);
    border: 1px solid var(--border);
  }

  .row.bot .bubble {
    background: transparent;
    border-left: 2px solid var(--accent-dim);
    border-radius: 0;
    padding-left: 12px;
  }

  .bubble.typing::after {
    content: "▍";
    color: var(--accent);
    animation: blink 1s step-start infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  form {
    display: flex;
    gap: 10px;
    padding: 16px 24px 22px;
    border-top: 1px solid var(--border);
  }

  input {
    flex: 1;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 14.5px;
    outline: none;
  }

  input:focus {
    border-color: var(--accent);
  }

  button {
    background: var(--accent);
    color: #201404;
    border: none;
    padding: 0 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }

  button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .error {
    color: #e07070;
    font-size: 13px;
    padding: 0 24px 8px;
  }

  #log::-webkit-scrollbar { width: 8px; }
  #log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="label">Groq · GPT-OSS-120B</div>
    <h1>Chatbot</h1>
  </header>

  <div id="log"></div>
  <div class="error" id="errorMsg" style="display:none;"></div>

  <form id="chatForm">
    <input id="input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button id="sendBtn" type="submit">Send</button>
  </form>
</div>

<script>
  // Change this to your deployed API URL, e.g. "https://your-project.vercel.app/chat"
  // Leave as "/chat" if this HTML file is served from the same Vercel project.
  const API_URL = "/chat";

  const log = document.getElementById("log");
  const form = document.getElementById("chatForm");
  const input = document.getElementById("input");
  const sendBtn = document.getElementById("sendBtn");
  const errorMsg = document.getElementById("errorMsg");

  let history = [];

  function addBubble(role, text) {
    const row = document.createElement("div");
    row.className = "row " + (role === "user" ? "user" : "bot");

    const who = document.createElement("div");
    who.className = "who";
    who.textContent = role === "user" ? "You" : "Chatbot";

    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;

    row.appendChild(who);
    row.appendChild(bubble);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return bubble;
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const message = input.value.trim();
    if (!message) return;

    errorMsg.style.display = "none";
    addBubble("user", message);
    input.value = "";
    sendBtn.disabled = true;

    const typingBubble = addBubble("bot", "");
    typingBubble.classList.add("typing");

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });

      const data = await res.json();

      if (data.error) {
        throw new Error(data.error);
      }

      typingBubble.classList.remove("typing");
      typingBubble.textContent = data.reply;

      history.push({ role: "user", content: message });
      history.push({ role: "assistant", content: data.reply });

    } catch (err) {
      typingBubble.parentElement.remove();
      errorMsg.textContent = "Error: " + err.message;
      errorMsg.style.display = "block";
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
